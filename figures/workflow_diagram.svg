<svg viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4C4C4C"/>
    </marker>
  </defs>

  <rect width="1200" height="340" fill="#ffffff"/>

  <!-- Stage 1: generate_datasets.py -->
  <rect x="20" y="110" width="190" height="110" rx="10" fill="#EAF3FB" stroke="#2E6DA4" stroke-width="1.5"/>
  <text x="115" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#1B3A57">scripts/</text>
  <text x="115" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#1B3A57">generate_datasets.py</text>
  <text x="115" y="182" text-anchor="middle" font-size="11" fill="#375A78">seeded simulation</text>
  <text x="115" y="198" text-anchor="middle" font-size="11" fill="#375A78">documented rationale</text>

  <!-- Arrow 1 -->
  <line x1="210" y1="165" x2="255" y2="165" stroke="#4C4C4C" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2: data/*.csv -->
  <rect x="260" y="110" width="170" height="110" rx="10" fill="#EFF7EC" stroke="#4C8C4A" stroke-width="1.5"/>
  <text x="345" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C5A2A">data/</text>
  <text x="345" y="160" text-anchor="middle" font-size="13" fill="#2C5A2A">10 datasets (.csv)</text>
  <text x="345" y="182" text-anchor="middle" font-size="11" fill="#3E6E3B">+ data_dictionary.md</text>

  <!-- Arrow 2 -->
  <line x1="430" y1="165" x2="475" y2="165" stroke="#4C4C4C" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3: bioviz package -->
  <rect x="480" y="90" width="200" height="150" rx="10" fill="#FBF0E4" stroke="#C77D2E" stroke-width="1.5"/>
  <text x="580" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#7A4A16">bioviz/</text>
  <text x="580" y="138" text-anchor="middle" font-size="11" fill="#7A4A16">theme · relational</text>
  <text x="580" y="154" text-anchor="middle" font-size="11" fill="#7A4A16">distributions · categorical</text>
  <text x="580" y="170" text-anchor="middle" font-size="11" fill="#7A4A16">regression · matrix</text>
  <text x="580" y="192" text-anchor="middle" font-size="11" font-style="italic" fill="#8A5A20">tested, importable package</text>
  <text x="580" y="210" text-anchor="middle" font-size="11" font-style="italic" fill="#8A5A20">20 pytest checks</text>

  <!-- Arrow 3 -->
  <line x1="680" y1="165" x2="725" y2="165" stroke="#4C4C4C" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 4: notebooks -->
  <rect x="730" y="90" width="200" height="150" rx="10" fill="#F4EEFB" stroke="#7B4FA0" stroke-width="1.5"/>
  <text x="830" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#4A2C66">notebooks/</text>
  <text x="830" y="140" text-anchor="middle" font-size="11" fill="#4A2C66">seaborn_beginner_guide</text>
  <text x="830" y="156" text-anchor="middle" font-size="11" fill="#4A2C66">matplotlib_practice</text>
  <text x="830" y="178" text-anchor="middle" font-size="11" font-style="italic" fill="#5E3A80">question → plot →</text>
  <text x="830" y="194" text-anchor="middle" font-size="11" font-style="italic" fill="#5E3A80">interpretation</text>
  <text x="830" y="212" text-anchor="middle" font-size="11" font-style="italic" fill="#5E3A80">executed end-to-end</text>

  <!-- Arrow 4 -->
  <line x1="930" y1="165" x2="975" y2="165" stroke="#4C4C4C" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 5: figures -->
  <rect x="980" y="110" width="200" height="110" rx="10" fill="#FBEAEA" stroke="#B4453F" stroke-width="1.5"/>
  <text x="1080" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#7A2B26">figures/</text>
  <text x="1080" y="160" text-anchor="middle" font-size="12" fill="#7A2B26">12 exported PNGs</text>
  <text x="1080" y="182" text-anchor="middle" font-size="11" fill="#8C3B34">300 DPI, publication-ready</text>
  <text x="1080" y="198" text-anchor="middle" font-size="11" fill="#8C3B34">embedded in README</text>

  <!-- CI bracket underneath -->
  <line x1="20" y1="260" x2="1180" y2="260" stroke="#999999" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="440" y="272" width="320" height="46" rx="8" fill="#F5F5F5" stroke="#888888" stroke-width="1"/>
  <text x="600" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#333333">.github/workflows/ci.yml</text>
  <text x="600" y="308" text-anchor="middle" font-size="10.5" fill="#555555">lint · regenerate data (determinism) · pytest · execute notebooks</text>

  <line x1="115" y1="260" x2="115" y2="220" stroke="#999999" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="345" y1="260" x2="345" y2="220" stroke="#999999" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="580" y1="260" x2="580" y2="240" stroke="#999999" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="830" y1="260" x2="830" y2="240" stroke="#999999" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="1080" y1="260" x2="1080" y2="220" stroke="#999999" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="600" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#222222">biology-data-viz-seaborn — pipeline</text>
  <text x="600" y="50" text-anchor="middle" font-size="12" fill="#555555">Seeded simulation → tested plotting package → narrative notebooks → publication figures, checked in CI</text>
</svg>
