name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and quality tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Lint
        run: ruff check bioviz scripts tests notebooks/*.py

      - name: Verify deterministic datasets
        run: |
          python scripts/generate_datasets.py
          git diff --exit-code -- data/*.csv

      - name: Test with coverage threshold
        run: pytest -q

      - name: Build advanced gallery
        run: python scripts/build_advanced_gallery.py

      - name: Execute notebooks
        run: |
          jupyter nbconvert --to notebook --execute --inplace \
            notebooks/seaborn_beginner_guide.ipynb \
            --ExecutePreprocessor.timeout=240
          jupyter nbconvert --to notebook --execute --inplace \
            notebooks/omics_case_studies.ipynb \
            --ExecutePreprocessor.timeout=240

      - name: Build package
        run: python -m build
