[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bioviz"
version = "1.1.0"
description = "Tested statistical and omics visualization utilities for biology and bioinformatics."
readme = "README.md"
license = "MIT"
authors = [{ name = "mbilal-OU" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scipy>=1.11",
]

[dependency-groups]
dev = [
    "build>=1.2",
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "jupytext>=1.16",
    "mkdocs>=1.6,<2",
    "nbconvert>=7.16",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[project.urls]
Documentation = "https://mbilal-ou.github.io/seaborn-biological-statistics/"
Repository = "https://github.com/mbilal-OU/seaborn-biological-statistics"
Issues = "https://github.com/mbilal-OU/seaborn-biological-statistics/issues"

[tool.setuptools.packages.find]
include = ["bioviz*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=bioviz --cov-report=term-missing --cov-fail-under=95"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"scripts/_build_readme_gallery.py" = ["E501"]
